[project]
name = "spritecraft"
version = "0.1.0"
description = "Style-guided Pixel-art Reference Image Transfer Engine for Minecraft"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.0",
    "numpy",
    "pillow",
    "scikit-learn",
    "tensorboard",
]

[project.scripts]
spritecraft = "spritecraft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spritecraft"]
